<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<title>上传文件</title>
<link rel="stylesheet" href="./assets/ws-style.css?v=79c2c0c299">
<style>
  .up-page { max-width: 720px; margin: 0 auto; padding: 4vh max(3vw, 20px) 8vh; color: #e6eef7; }
  .up-page h1 { color: #fff; font-size: clamp(22px, 3.6vh, 30px); }
  .up-card { background: #16283c; border: 1px solid #1e3248; border-radius: 10px; padding: 20px; margin-top: 2.4vh; }
  .up-field { display: block; margin: 14px 0; }
  .up-field label { display: block; color: #a8b8c8; font-size: 13px; margin-bottom: 6px; }
  .up-field input[type="text"], .up-field input[type="file"] {
    width: 100%; background: #0d1b2a; border: 1px solid #3a5572; color: #e6eef7;
    border-radius: 8px; padding: 8px 12px; font-size: 13.5px;
  }
  .up-field input[type="file"] { padding: 6px; }
  .up-go { margin-top: 6px; background: var(--orange); border: none; color: #fff; border-radius: 8px;
    padding: 10px 22px; font-size: 14px; cursor: pointer; }
  .up-go:disabled { opacity: .55; cursor: not-allowed; }
  .up-card.dragover { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(230,126,34,.18); }
  .up-drop-hint { margin-top: 8px; color: #5f7388; font-size: 12.5px; }
  .up-progress { height: 6px; background: #0d1b2a; border-radius: 3px; margin-top: 14px; overflow: hidden; display: none; }
  .up-progress i { display: block; height: 100%; width: 0; background: var(--orange); transition: width .15s; }
  .up-msg { margin-top: 14px; color: #a8b8c8; font-size: 13px; }
  .up-msg.ok { color: #7fd48c; } .up-msg.bad { color: #ffb4a0; }
  ul.up-res { list-style: none; margin-top: 16px; }
  ul.up-res li { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13.5px; word-break: break-all; }
  ul.up-res li b.ok { color: #7fd48c; } ul.up-res li b.bad { color: #ffb4a0; }
  ul.up-sel { list-style: none; margin: 2px 0 10px; }
  ul.up-sel li { display: flex; align-items: center; gap: 10px; padding: 9px 6px;
    border-bottom: 1px solid rgba(255,255,255,.07); font-size: 13.5px; }
  .up-sel .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; word-break: break-all; }
  .up-sel .sz { color: #5f7388; font-size: 12px; flex: 0 0 auto; }
  .up-sel .rm { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 8px; border: 1px solid #3a5572;
    background: none; color: #ffb4a0; font-size: 17px; cursor: pointer; touch-action: manipulation; }
  .up-sel .rm:hover { border-color: var(--orange); color: var(--orange); }
  @media (max-width: 640px) { ul.up-sel .nm { max-width: 62%; } }
  .up-locked { color: #a8b8c8; }
</style>
</head>
<body>
<main class="up-page">
  <header>
    <h1>上传文件</h1>
    <p style="color:#a8b8c8;font-size:13px;margin-top:6px;">目标路径：<code>docs/&lt;目录&gt;/…</code>，提交后 GitHub Actions 会自动刷新文件列表。</p>
    <p style="color:#a8b8c8;font-size:12.5px;margin-top:4px" id="upRepo"></p>
  </header>

  <form class="up-card" id="upForm" hidden>
    <div class="up-field">
      <label for="upDir">目标目录（相对 docs/，默认 uploads；可手填子目录如 reports/）</label>
      <input type="text" id="upDir" value="uploads" placeholder="uploads">
    </div>
    <div class="up-field">
      <label for="upFiles">选择文件（可多选；也可直接将文件拖拽到下方卡片内）</label>
      <input type="file" id="upFiles" multiple>
      <p class="up-drop-hint">支持点击选择 或 拖拽到此处（不支持整个文件夹）。</p>
    </div>
    <ul class="up-sel" id="upSel" hidden></ul>
    <button class="up-go" id="upGo">上传</button>
    <div class="up-progress" id="upBar"><i id="upBarFill"></i></div>
    <p class="up-msg" id="upMsg"></p>
    <ul class="up-res" id="upRes"></ul>
  </form>

  <div class="up-card" id="upLocked" hidden>
    <p class="up-locked">未授权：请携带 <code>?up=&lt;Token&gt;</code> 访问本页（例如 <code>app/upload.html?up=…</code>）。</p>
  </div>

  <p class="up-msg" style="margin-top:2vh;">
    安全说明：Token 仅存于本次会话内存（sessionStorage），不会写入任何文件/提交；建议使用「本仓库 + contents 读写」的 fine-grained PAT，并定期轮换。
  </p>
</main>

<script src="./assets/ws-upload.js?v=79c2c0c299"></script>
</body>
</html>
