<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
<title>Markdown 预览</title>
<link rel="stylesheet" href="./assets/ws-style.css?v=79c2c0c299">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
<div class="ws-viewer" id="wsViewer">

  <div id="fullscreenRoot" class="ws-fullscreen-root">
    <header class="ws-toolbar">
      <a class="home" href="./" title="返回文件列表">‹ 目录</a>
      <div class="title" id="wsTitle">Markdown 预览</div>
      <div class="actions">
        <a class="ws-btn" id="wsRaw" href="#" target="_blank" rel="noopener">原文</a>
        <a class="ws-btn" id="wsDownload" href="#" download>下载</a>
      </div>
    </header>

    <main class="md-content" id="mdContent"></main>
  </div>

  <div class="ws-render-root" id="renderRoot" aria-hidden="true"></div>

  <div class="ws-overlay" id="wsOverlay">
    <div class="ws-spinner" id="wsSpinner"></div>
    <div class="msg" id="wsMsg">正在加载 Markdown…</div>
    <div class="hint" id="wsHint"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="./assets/ws-mdviewer.js?v=79c2c0c299"></script>
</body>
</html>
